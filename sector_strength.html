<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>板块相对强度 · 90行业收盘线</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--bd:#30363d;--tx:#e6edf3;--tx2:#8b949e;--acc:#58a6ff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font:14px/1.5 "Microsoft YaHei",sans-serif;padding:18px;}
h1{font-size:20px;margin-bottom:4px;}
.note{color:var(--tx2);font-size:12px;margin-bottom:14px;}
.layout{display:flex;gap:12px;align-items:flex-start;}
.chartCol{flex:1;min-width:0;}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:14px;position:sticky;top:0;z-index:10;}
#legendCol{width:208px;flex-shrink:0;background:var(--panel);border:1px solid var(--bd);border-radius:10px;max-height:640px;overflow-y:auto;padding:8px 6px;font-size:12px;}
#legendCol h4{font-size:12px;color:var(--tx2);margin:2px 4px 6px;font-weight:normal;}
.lgRow{display:flex;align-items:center;gap:6px;padding:2px 6px;border-radius:5px;cursor:pointer;white-space:nowrap;}
.lgRow:hover{background:#21262d;}
.lgRow .sw{width:16px;height:4px;border-radius:2px;flex-shrink:0;}
.lgRow .lnm{flex:1;overflow:hidden;text-overflow:ellipsis;color:var(--tx);}
.lgRow .lpc{font-variant-numeric:tabular-nums;font-size:11px;flex-shrink:0;}
.lgRow.hi{background:#2d1d0e;outline:1px solid #d29922;}
.lgRow.dim .lnm, .lgRow.dim .lpc{color:#6e7681;}
.lgRow.dim .sw{opacity:.25;}
.seg{display:flex;gap:0;border:1px solid var(--bd);border-radius:8px;overflow:hidden;}
.seg button{background:transparent;color:var(--tx2);border:0;padding:5px 14px;cursor:pointer;font-size:13px;}
.seg button.on{background:#21262d;color:var(--tx);font-weight:bold;}
select{background:#0d1117;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font-size:13px;}
input[type=text]{background:#0d1117;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font-size:13px;width:120px;}
.legend{font-size:12px;color:var(--tx2);}
#main{width:100%;border:1px solid var(--bd);border-radius:10px 10px 0 0;background:var(--panel);cursor:crosshair;}
#sub{width:100%;border:1px solid var(--bd);border-top:0;border-radius:0 0 10px 10px;background:var(--panel);cursor:crosshair;margin-top:-1px;display:block;}
#rankWrap{margin-top:14px;background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;max-height:340px;overflow-y:auto;}
#rankWrap h3{font-size:14px;margin-bottom:8px;color:var(--tx);}
.rankRow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px;}
.rankRow .nm{width:110px;text-align:right;color:var(--tx);cursor:pointer;flex-shrink:0;}
.rankRow .nm:hover{color:var(--acc);text-decoration:underline;}
.rankRow.hi .nm{color:#ffd580;font-weight:bold;}
.rankRow.hi .val{font-weight:bold;}
.rankRow .track{flex:1;background:#21262d;border-radius:3px;height:16px;position:relative;}
.rankRow .fill{height:100%;border-radius:3px;position:absolute;top:0;}
.rankRow .val{width:70px;flex-shrink:0;font-variant-numeric:tabular-nums;}
#tip{position:fixed;background:#161b22;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font-size:12px;pointer-events:none;z-index:99;display:none;box-shadow:0 4px 16px rgba(0,0,0,.6);max-width:340px;}
#tip b{color:var(--acc);}
#tip table{border-collapse:collapse;margin-top:4px;}
#tip td,#tip th{padding:1px 6px;font-size:11px;border-bottom:1px solid #21262d;}
.pos{color:#3fb950;} .neg{color:#f85149;}
</style>
</head>
<body>
<h1>板块相对强度 · 90行业收盘线</h1>
<div class="note" id="metaNote">数据: ths_kline 90行业指数日线 · 一眼识别走强/走弱板块 · 悬停读值 · 点行业名看单板块放大</div>

<div class="bar">
  <span class="legend">时间</span>
  <div class="seg" id="segRange"></div>
  <span class="legend">模式</span>
  <div class="seg" id="segMode">
    <button data-m="norm" class="on">净值化(起点=1)</button>
    <button data-m="excess">相对沪深300超额</button>
    <button data-m="raw">原始收盘</button>
  </div>
  <span class="legend">基准</span>
  <select id="benchSel"></select>
  <span class="legend">排序(图例)</span>
  <select id="sortSel">
    <option value="chg">区间涨幅↑</option>
    <option value="code">代码</option>
  </select>
  <input type="text" id="q" placeholder="搜行业名…">
</div>

<div class="layout">
<div class="chartCol">
<canvas id="main" height="460"></canvas>
<canvas id="sub" height="200"></canvas>
</div>
<div id="legendCol"><h4>图例 · 点选高亮 (双击放大)</h4><div id="legendBody"></div></div>
</div>
<div id="rankWrap"><h3 id="rankTitle">区间涨幅排名</h3><div id="rankBody"></div></div>
<div id="tip"></div>

<script>
'use strict';
var DATA=null, CODES=[], NAMES={}, RANGE=250, MODE='norm', BENCH='000300', SORT='chg';
var VOLW=60;   // 波动率窗口: 60日滚动日收益std, 年化×√250; burn-in用窗前历史, 窗首即有值
var RANGES=[['60日',60],['一年',250],['两年',500],['四年',1000],['全部',99999]];
var CR=[];
var CRSUB=null;   // 副图(波动率)状态: 供悬停读值
// 配色: 冷暖渐变按排名分配(涨=红暖, 跌=绿冷, 中间灰) — A股习惯红涨绿跌
var HI=null;   // 选中高亮的行业code (null=全部彩色)
var HOV=null;  // 图例悬停的行业code (临时强调, 不改选中)
var SEL={};    // 多选集合: code→true (勾选的保持彩色, 未勾的灰显; 空=全部彩色)
function rankColors(n){
  var arr=[];
  for(var i=0;i<n;i++){
    var t=i/(n-1);  // 0=最强
    if(t<0.5){ var u=t/0.5; arr.push('hsl('+(0+u*14)+', '+(85-u*35)+'%, '+(52+u*6)+'%)'); }        // 红→橙
    else { var v=(t-0.5)/0.5; arr.push('hsl('+(140-v*10)+', '+(50+v*30)+'%, '+(58-v*14)+'%)'); }   // 绿
  }
  return arr;
}
function fmtPct(x){ return (x>=0?'+':'')+(x*100).toFixed(1)+'%'; }
function fmtDate(s){ return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8); }

fetch('sector_close.json?_='+Date.now()).then(function(r){return r.json();}).then(function(d){
  DATA=d; NAMES=d.names||{};
  CODES=Object.keys(d.series).sort();
  // 基准池: 行业本身 + 等权全行业均值
  var sel=document.getElementById('benchSel');
  sel.innerHTML='<option value="EQUAL">等权90行业均值</option>'+CODES.map(function(c){return '<option value="'+c+'">'+(NAMES[c]||c)+'</option>';}).join('');
  sel.value=BENCH;
  sel.onchange=function(){ BENCH=this.value; render(); };
  var seg=document.getElementById('segRange');
  seg.innerHTML=RANGES.map(function(r,i){return '<button data-r="'+r[1]+'"'+(r[1]===250?' class="on"':'')+'>'+r[0]+'</button>';}).join('');
  seg.querySelectorAll('button').forEach(function(b){ b.onclick=function(){
    seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on');
    RANGE=+b.dataset.r; render(); };});
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && HI){ HI=null; render(); } });
  document.querySelectorAll('#segMode button').forEach(function(b){ b.onclick=function(){
    document.querySelectorAll('#segMode button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on');
    MODE=b.dataset.m; render(); };});
  document.getElementById('sortSel').onchange=function(){ SORT=this.value; render(); };
  document.getElementById('q').oninput=function(){ render(); };
  render();
}).catch(function(e){ document.getElementById('metaNote').textContent='加载失败: '+e; });

function benchSeries(dates){
  if(BENCH==='EQUAL'){
    var s=[]; for(var i=0;i<dates.length;i++){ var v=0,n=0;
      for(var c=0;c<CODES.length;c++){ var ser=DATA.series[CODES[c]]; var j=i<ser.length?i:-1; /*aligned by index*/ }
      // 按索引对齐(所有行业日期轴一致由构建保证)
      for(var c2=0;c2<CODES.length;c2++){ var ser2=DATA.series[CODES[c2]]; if(i<ser2.length&&ser2[i][1]!=null){v+=ser2[i][1];n++;} }
      s.push(n?v/n:null); }
    return s;
  }
  var ser=DATA.series[BENCH]||[]; return dates.map(function(d,i){ return i<ser.length?ser[i][1]:null; });
}

function render(){
  if(!DATA) return;
  var dates=DATA.dates.slice(Math.max(0,DATA.dates.length-RANGE));
  var i0=DATA.dates.length-dates.length;
  var series={}, chg={}, volSeries={};
  var bench=benchSeries(dates);
  CODES.forEach(function(c){
    var ser=DATA.series[c];
    if(!ser) return;
    // 按日期字符串建索引(各行业轴有洞, 不能用全局索引对位)
    var dmap={}; for(var mi=0; mi<ser.length; mi++){ dmap[String(ser[mi][0])]=ser[mi][1]; }
    var vals=dates.map(function(d){ return (d in dmap)? dmap[d] : null; });
    // 窗内完整数据判定: 首日即有值(或首日起历史更短但起点<=窗首) — 排名只纳入可比行业
    var firstIdx=-1; for(var fi=0; fi<vals.length; fi++){ if(vals[fi]!=null){ firstIdx=fi; break; } }
    var complete = firstIdx===0;
    // 波动率副图(始终计算): 全历史close→对数日收益, 窗内每日期取前VOLW个收益std, 年化×√250
    {
      var allD=DATA.dates;
      var cl=allD.map(function(d){ return (d in dmap)? dmap[d] : null; });
      var rets=[];
      for(var vi=0; vi<allD.length; vi++){
        var p0=cl[vi-1], p1=cl[vi];
        if(p0!=null && p1!=null && p0>0) rets.push(Math.log(p1/p0)); else rets.push(null);
      }
      var vols=[];
      for(var wi=0; wi<dates.length; wi++){
        var gi=i0+wi;
        if(cl[gi]==null){ vols.push(null); continue; }
        var arr=[];
        for(var k=gi-VOLW+1; k<=gi; k++){ if(k>=0 && rets[k]!=null){ arr.push(rets[k]); } }
        if(arr.length>=VOLW*0.9){
          var m=arr.reduce(function(a,b){return a+b;},0)/arr.length;
          var vv=arr.reduce(function(a,b){ return a+(b-m)*(b-m); },0)/(arr.length-1);
          vols.push(Math.sqrt(vv)*Math.sqrt(250));
        } else vols.push(null);
      }
      volSeries[c]=vols;
    }
    var base=null; if(firstIdx>=0) base=vals[firstIdx];
    if(MODE==='norm'){ vals=vals.map(function(v){ return (v!=null&&base)? v/base : null; }); }
    else if(MODE==='excess'){ vals=vals.map(function(v,i2){ return (v!=null&&bench[i2]!=null&&bench[i2][0]) ? v/bench[i2] : null; }); }
    series[c]=vals;
    var a=base, z=null; for(var zi=vals.length-1; zi>=0; zi--){ if(vals[zi]!=null){ z=vals[zi]; break; } }
    // raw模式chg直接用close; norm/excess下z已是比值→chg=z-1(或z-1) — 统一: 非raw时z即终点/起点
    chg[c]=(a!=null&&z!=null&&a)? (MODE==='raw'? z/a-1 : z-1) : null;
    if(!complete) chg[c]=null;   // 后上市(窗内起)不进排名, 曲线照画
  });
  drawChart(dates, series, chg);
  drawSub(dates, volSeries, chg);
  drawRank(chg);
  drawLegend(chg, dates);
  document.getElementById('metaNote').textContent='数据: ths_kline 90行业 · '+dates.length+'日 ('+fmtDate(dates[0])+' → '+fmtDate(dates[dates.length-1])+') · 主图='+({norm:'净值化',excess:'相对超额',raw:'原始'})[MODE]+' · 副图=波动率(60日滚动年化) · 悬停读值/点行业名放大';
}

// 波动率副图: 与主图同X轴同配色, 上下对照涨跌节奏与波动节奏
function drawSub(dates, volSeries, chg){
  var cv=document.getElementById('sub');
  var W=cv.clientWidth||1200; cv.width=W; cv.height=200;
  var ctx=cv.getContext('2d');
  ctx.clearRect(0,0,W,200);
  var padL=210, padR=150, padT=18, padB=24;
  var n=dates.length;
  var lo=Infinity, hi=-Infinity;
  var order=Object.keys(volSeries);
  order.forEach(function(c){ volSeries[c].forEach(function(v){ if(v!=null){ if(v<lo)lo=v; if(v>hi)hi=v; } }); });
  if(!isFinite(lo)){lo=0;hi=1;}
  var span=(hi-lo)||1; lo=Math.max(0,lo-span*0.03); hi+=span*0.03;
  var X=function(i){ return padL+(W-padL-padR)*i/Math.max(1,n-1); };
  var Y=function(v){ return padT+(200-padT-padB)*(1-(v-lo)/(hi-lo)); };
  // 排名配色: 主图排名色(涨幅), 副图沿用 — 但按当前波动率高低给线宽提示
  var ranked=order.slice().sort(function(a,b){ return (chg[b]==null?-99:chg[b])-(chg[a]==null?-99:chg[a]); });
  var colors={}; rankColors(ranked.length).forEach(function(col,i){ colors[ranked[i]]=col; });
  // 标题与Y轴
  ctx.fillStyle='#8b949e'; ctx.font='11px sans-serif';
  ctx.fillText('波动率(60日年化) ▼', padL+6, 13);
  for(var g=0; g<=3; g++){
    var v=lo+(hi-lo)*g/3, y=Y(v);
    ctx.strokeStyle='#21262d'; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillStyle='#8b949e'; ctx.fillText((v*100).toFixed(0)+'%', 8, y+4);
  }
  // 曲线(与主图同drawOrder逻辑: 弱→强)
  var focus = HI || HOV;
  var hasSel = Object.keys(SEL).length>0;
  var drawOrder = ranked.slice().reverse();
  drawOrder.forEach(function(c){
    var vals=volSeries[c]; if(!vals) return;
    var dim = (hasSel && !SEL[c]) || (focus && focus!==c && !hasSel);
    var alpha = (hasSel && !SEL[c]) ? 0.10 : ((focus && focus!==c) ? 0.38 : 1);
    ctx.strokeStyle = dim ? 'rgba(139,148,158,'+alpha+')' : colors[c];
    ctx.lineWidth = (focus===c || (hasSel && SEL[c])) ? 2.4 : 1.1;
    if(focus===c) ctx.lineWidth=3.0;
    ctx.beginPath(); var started=false;
    for(var i=0;i<vals.length;i++){ var v=vals[i]; if(v==null){started=false;continue;}
      var x=X(i), y=Y(v);
      if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y); }
    ctx.stroke();
  });
  // 右缘: 当前波动率Top3标签(或选中/勾选行业)
  var vNow={};
  order.forEach(function(c){ var z=null; for(var i=volSeries[c].length-1;i>=0;i--){ if(volSeries[c][i]!=null){z=volSeries[c][i];break;} } if(z!=null) vNow[c]=z; });
  var vRanked=Object.keys(vNow).sort(function(a,b){ return vNow[b]-vNow[a]; });
  var labelSet = hasSel ? vRanked.filter(function(c){return SEL[c];}).slice(0,12)
              : vRanked.slice(0,3).concat(focus&&vNow[focus]!=null&&vRanked.indexOf(focus)>2?[focus]:[]);
  labelSet.forEach(function(c){
    var z=null, zi=-1;
    for(var i=volSeries[c].length-1;i>=0;i--){ if(volSeries[c][i]!=null){z=volSeries[c][i];zi=i;break;} }
    if(z==null) return;
    var y=Y(z);
    ctx.fillStyle = (focus && focus!==c) ? 'rgba(139,148,158,0.35)' : colors[c];
    ctx.font=(focus===c)?'bold 12px sans-serif':'bold 10px sans-serif';
    ctx.fillText((NAMES[c]||c)+' '+(z*100).toFixed(0)+'%', W-padR+6, y+3);
  });
  CRSUB={dates:dates, series:volSeries, order:ranked, colors:colors, X:X, Y:Y, vNow:vNow, padL:padL, padR:padR};
  bindSubHover();
}

function drawChart(dates, series, chg){
  var cv=document.getElementById('main');
  var W=cv.clientWidth||1200; cv.width=W; cv.height=460;
  var ctx=cv.getContext('2d');
  ctx.clearRect(0,0,W,460);
  var padL=210, padR=150, padT=26, padB=30;
  var n=dates.length;
  // y域
  var lo=Infinity, hi=-Infinity;
  var order=Object.keys(series);
  order.forEach(function(c){ series[c].forEach(function(v){ if(v!=null){ if(v<lo)lo=v; if(v>hi)hi=v; } }); });
  if(!isFinite(lo)){lo=0;hi=1;}
  var span=(hi-lo)||1; lo-=span*0.03; hi+=span*0.03;
  var X=function(i){ return padL+(W-padL-padR)*i/Math.max(1,n-1); };
  var Y=function(v){ return padT+(460-padT-padB)*(1-(v-lo)/(hi-lo)); };
  // 排名配色
  var ranked=order.slice().sort(function(a,b){ return (chg[b]==null?-99:chg[b])-(chg[a]==null?-99:chg[a]); });
  var colors={}; rankColors(ranked.length).forEach(function(col,i){ colors[ranked[i]]=col; });
  CR={dates:dates, series:series, order:ranked, colors:colors, X:X, Y:Y, chg:chg, lo:lo, hi:hi, padL:padL, padR:padR, padT:padT};
  // 网格
  ctx.strokeStyle='#21262d'; ctx.fillStyle='#8b949e'; ctx.font='11px sans-serif';
  for(var g=0; g<=4; g++){
    var v=lo+(hi-lo)*g/4, y=Y(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    var lab = MODE==='raw' ? v.toFixed(0) : v.toFixed(2);
    ctx.fillText(lab, 6, y+4);
  }
  // x刻度 6段
  for(var gx=0; gx<=5; gx++){
    var i=Math.round((n-1)*gx/5);
    ctx.fillText(fmtDate(dates[i]).slice(2), X(i)-22, 452);
    ctx.strokeStyle='#161b22'; ctx.beginPath(); ctx.moveTo(X(i),padT); ctx.lineTo(X(i),460-padB); ctx.stroke();
  }
  // 曲线(弱的先画,强的后画盖上面; 多选过滤: 只勾选的彩色; 单选高亮: 选中线加粗, 其余灰; 悬停: 悬停线亮)
  var focus = HI || HOV;   // 当前强调对象(优先选中)
  var hasSel = Object.keys(SEL).length>0;
  var drawOrder = ranked.slice().reverse();
  drawOrder.forEach(function(c){
    var vals=series[c]; if(!vals) return;
    var dim = (hasSel && !SEL[c]) || (focus && focus!==c && !hasSel);
    var alpha = (hasSel && !SEL[c]) ? 0.10 : ((focus && focus!==c) ? 0.38 : 1);
    ctx.strokeStyle = dim ? 'rgba(139,148,158,'+alpha+')' : colors[c];
    ctx.lineWidth = (focus===c || (hasSel && SEL[c])) ? 2.2 : 1.3;
    if(focus===c) ctx.lineWidth=2.8;
    ctx.beginPath(); var started=false;
    for(var i=0;i<vals.length;i++){ var v=vals[i]; if(v==null){started=false;continue;}
      var x=X(i), y=Y(v);
      if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y); }
    ctx.stroke();
  });
  // 强调线补光晕+终点圆点(选中或悬停)
  if(focus && series[focus]){
    var hv=series[focus], hLastI=-1;
    for(var hi2=hv.length-1; hi2>=0; hi2--){ if(hv[hi2]!=null){ hLastI=hi2; break; } }
    ctx.save();
    ctx.strokeStyle=colors[focus]; ctx.lineWidth=5; ctx.globalAlpha=0.18;
    ctx.beginPath(); var st2=false;
    for(var i2=0;i2<hv.length;i2++){ if(hv[i2]==null){st2=false;continue;}
      if(!st2){ ctx.moveTo(X(i2),Y(hv[i2])); st2=true; } else ctx.lineTo(X(i2),Y(hv[i2])); }
    ctx.stroke(); ctx.restore();
    if(hLastI>=0){ ctx.fillStyle=colors[focus]; ctx.beginPath(); ctx.arc(X(hLastI),Y(hv[hLastI]),4,0,7); ctx.fill(); }
  }
  // 右缘标签(排名前12+后4; 强调行业恒显; 多选时只标勾选的)
  var labelSet;
  if(hasSel){ labelSet = ranked.filter(function(c){ return SEL[c]; }); }
  else { labelSet = ranked.slice(0,12).concat(SORT==='code'?[]:ranked.slice(-4)); }
  if(focus && labelSet.indexOf(focus)<0) labelSet=labelSet.concat([focus]);
  labelSet.forEach(function(c){
    var vals=series[c]; var lastV=null, lastI=0;
    for(var i=vals.length-1;i>=0;i--){ if(vals[i]!=null){lastV=vals[i];lastI=i;break;} }
    if(lastV==null) return;
    var y=Y(lastV);
    ctx.fillStyle = (focus && focus!==c) ? 'rgba(139,148,158,0.35)' : colors[c];
    ctx.font = (focus===c) ? 'bold 13px sans-serif' : 'bold 11px sans-serif';
    var nm=(NAMES[c]||c)+' '+(MODE==='vol'?(chg[c]*100).toFixed(1)+'%':fmtPct(chg[c]||0));
    ctx.fillText(nm, W-padR+8, y+4);
  });
  bindHover();
}

function drawRank(chg){
  var q=(document.getElementById('q').value||'').trim();
  var list=Object.keys(chg).filter(function(c){ return chg[c]!=null && (!q || (NAMES[c]||'').indexOf(q)>=0 || c.indexOf(q)>=0); });
  list.sort(function(a,b){ return chg[b]-chg[a]; });
  var ranked=Object.keys(chg).filter(function(c){return chg[c]!=null;}).sort(function(a,b){return chg[b]-chg[a];});
  var maxAbs=Math.max.apply(null, ranked.map(function(c){return Math.abs(chg[c]);}).concat([0.01]));
  var colors={}; rankColors(ranked.length).forEach(function(col,i){ colors[ranked[i]]=col; });
  document.getElementById('rankTitle').textContent=(MODE==='vol'?'当前年化波动率排名':'区间涨幅排名')+(q?(' · 搜"'+q+'"'):'')+' (点行业名→单板块放大)' + (Object.keys(chg).filter(function(c){return chg[c]==null;}).length ? ' · 灰注: 窗内数据不完整的行业不参与排名' : '');
  document.getElementById('rankBody').innerHTML=list.map(function(c,i){
    var w, dir, valTxt;
    if(MODE==='vol'){ w=chg[c]/maxAbs*100; dir=true; valTxt=(chg[c]*100).toFixed(1)+'%'; }
    else { w=Math.abs(chg[c])/maxAbs*50; dir=chg[c]>=0; valTxt=fmtPct(chg[c]); }
    return '<div class="rankRow'+(HI===c?' hi':'')+'"><span style="width:26px;color:#8b949e;flex-shrink:0">'+(i+1)+'</span>'+
      '<span class="nm" data-c="'+c+'">'+(NAMES[c]||c)+'</span>'+
      '<div class="track"><div class="fill" style="width:'+(MODE==='vol'?w:w*2)+'%;'+(dir?'left:50%;background:#da3633;':'right:50%;background:#238636;')+'"></div><div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:#30363d;"></div></div>'+
      '<span class="val '+(dir?'pos':'neg')+'">'+valTxt+'</span></div>';
  }).join('');
  document.querySelectorAll('#rankBody .nm').forEach(function(el){
    el.onclick=function(){
      var c=el.dataset.c;
      if(HI===c){ HI=null; }           // 再点一次取消
      else if(HI){ HI=c; }             // 已有选中→切换 (不触发zoom)
      else { HI=c; }                    // 首次选中
      // 双击语义仍在: 保留zoom于双击
      render();
    };
    el.ondblclick=function(){ zoomOne(el.dataset.c); };
  });
}

function zoomOne(code){
  RANGE=Math.max(RANGE,250); BENCH=code; MODE='raw';
  document.getElementById('benchSel').value=code;
  document.querySelectorAll('#segMode button').forEach(function(x){ x.classList.toggle('on', x.dataset.m==='raw'); });
  render();
}

function drawLegend(chg, dates){
  var q=(document.getElementById('q').value||'').trim();
  var ranked=Object.keys(chg).filter(function(c){return chg[c]!=null;}).sort(function(a,b){return chg[b]-chg[a];});
  var colors={}; rankColors(ranked.length).forEach(function(col,i){ colors[ranked[i]]=col; });
  var list=ranked.filter(function(c){ return !q || (NAMES[c]||'').indexOf(q)>=0 || c.indexOf(q)>=0; });
  // 无数据行业(后上市)追加灰列尾部
  var noData=Object.keys(chg).filter(function(c){return chg[c]==null;});
  var html =
    list.map(function(c,i){
      return '<div class="lgRow'+(HI===c?' hi':'')+(HI&&HI!==c?' dim':'')+'" data-c="'+c+'">'+
        '<span style="width:22px;color:#8b949e;flex-shrink:0;font-size:10px">'+(i+1)+'</span>'+
        '<span class="sw" style="background:'+colors[c]+'"></span>'+
        '<span class="lnm">'+(NAMES[c]||c)+'</span>'+
        '<span class="lpc '+(chg[c]>=0?'pos':'neg')+'">'+(MODE==='vol'?(chg[c]*100).toFixed(1)+'%':fmtPct(chg[c]))+'</span></div>';
    }).join('') +
    (noData.length ? '<h4 style="margin-top:8px">窗内数据不完整</h4>' + noData.map(function(c){
      return '<div class="lgRow'+(HI===c?' hi':'')+(HI&&HI!==c?' dim':'')+'" data-c="'+c+'">'+
        '<span style="width:22px;flex-shrink:0">·</span>'+
        '<span class="sw" style="background:#6e7681"></span>'+
        '<span class="lnm">'+(NAMES[c]||c)+'</span>'+
        '<span class="lpc" style="color:#6e7681">—</span></div>';
    }).join('') : '');
  // 关键: HTML未变(如仅悬停HOV变化)时跳过重建 — 重建会销毁鼠标下的元素再触发mouseenter→render死循环, click事件永远配不成对
  if(drawLegend._last === html) return;
  drawLegend._last = html;
  document.getElementById('legendBody').innerHTML = html;
  document.querySelectorAll('#legendBody .lgRow').forEach(function(el){
    el.onclick=function(){
      var c=el.dataset.c;
      HI = (HI===c) ? null : c;
      render();
    };
    el.ondblclick=function(){
      HI=el.dataset.c;
      zoomOne(el.dataset.c);
    };
    el.onmouseenter=function(){ HOV=el.dataset.c; render(); };   // 悬停图例→图上临时强调
    el.onmouseleave=function(){ HOV=null; render(); };
  });
}

function bindHover(){
  var cv=document.getElementById('main'), tip=document.getElementById('tip');
  var nearestAt=function(mx,my){
    if(!CR) return null;
    var rect=cv.getBoundingClientRect();
    var n=CR.dates.length;
    var i=Math.round((mx-CR.padL)/((cv.width-CR.padL-CR.padR)/Math.max(1,n-1)));
    if(i<0||i>=n) return null;
    var best=null;
    CR.order.forEach(function(c){
      var v=CR.series[c][i]; if(v==null) return;
      var dy=Math.abs(CR.Y(v)-my);
      if(!best||dy<best.dy) best={c:c, dy:dy};
    });
    return best;
  };
  cv.onmousemove=function(e){
    if(!CR) return;
    var rect=cv.getBoundingClientRect();
    var mx=e.clientX-rect.left, my=e.clientY-rect.top;
    var n=CR.dates.length;
    var i=Math.round((mx-CR.padL)/((cv.width-CR.padL-CR.padR)/Math.max(1,n-1)));
    if(i<0||i>=n){ tip.style.display='none'; return; }
    // 找my最近的3条线
    var cand=[];
    CR.order.forEach(function(c){
      var v=CR.series[c][i]; if(v==null) return;
      cand.push({c:c, v:v, dy:Math.abs(CR.Y(v)-my)});
    });
    cand.sort(function(a,b){return a.dy-b.dy;});
    var top=cand.slice(0,3);
    var h='<b>'+fmtDate(CR.dates[i])+'</b> · '+({norm:'净值',excess:'相对比',raw:'收盘'})[MODE]+'<table>'+
      '<tr><th></th><th>'+({norm:'净值',excess:'相对比',raw:'收盘'})[MODE]+'</th><th>区间涨幅</th><th>波动率</th></tr>'+
      top.map(function(t){
        var v=CRSUB&&CRSUB.series[t.c]?CRSUB.series[t.c][i]:null;
        return '<tr><td style="color:'+CR.colors[t.c]+'">'+(NAMES[t.c]||t.c)+'</td><td>'+t.v.toFixed(MODE==='raw'?0:3)+'</td><td class="'+(CR.chg[t.c]>=0?'pos':'neg')+'">'+fmtPct(CR.chg[t.c]||0)+'</td><td style="color:#d29922">'+(v!=null?(v*100).toFixed(1)+'%':'—')+'</td></tr>'; }).join('')+
      '</table>';
    tip.innerHTML=h; tip.style.display='block';
    tip.style.left=Math.min(e.clientX+16, window.innerWidth-360)+'px';
    tip.style.top=(e.clientY+14)+'px';
    // 悬停近线光标提示
    var nb=nearestAt(mx,my);
    cv.title = nb ? '点击选中 '+(NAMES[nb.c]||nb.c)+'（高亮,其余灰显）' : '';
  };
  cv.onclick=function(e){
    if(!CR) return;
    var rect=cv.getBoundingClientRect();
    var nb=nearestAt(e.clientX-rect.left, e.clientY-rect.top);
    if(nb && nb.dy<18){                 // 18px内算点中
      HI = (HI===nb.c) ? null : nb.c;   // 再点同线取消
      render();
    } else {
      HI=null; render();                // 点空白处清除选中
    }
  };
  cv.ondblclick=function(){ if(HI) zoomOne(HI); };
  cv.onmouseleave=function(){ tip.style.display='none'; };
}

// 副图(波动率)悬停+点选: 与主图同语义

    var best=null;
    CRSUB.order.forEach(function(c){
      var v=CRSUB.series[c][i]; if(v==null) return;
      var dy=Math.abs(CRSUB.Y(v)-my);
      if(!best||dy<best.dy) best={c:c, dy:dy};
    });
    return best;
  };
  cv.onmousemove=function(e){
    if(!CRSUB) return;
    var rect=cv.getBoundingClientRect();
    var mx=e.clientX-rect.left, my=e.clientY-rect.top;
    var n=CRSUB.dates.length;
    var i=Math.round((mx-CRSUB.padL)/((cv.width-CRSUB.padL-CRSUB.padR)/Math.max(1,n-1)));
    if(i<0||i>=n){ tip.style.display='none'; return; }
    var cand=[];
    CRSUB.order.forEach(function(c){
      var v=CRSUB.series[c][i]; if(v==null) return;
      cand.push({c:c, v:v, dy:Math.abs(CRSUB.Y(v)-my)});
    });
    cand.sort(function(a,b){return a.dy-b.dy;});
    var top=cand.slice(0,3);
    var h='<b>'+fmtDate(CRSUB.dates[i])+'</b> · 波动率(60日年化)<table>'+
      top.map(function(t){ return '<tr><td style="color:'+CRSUB.colors[t.c]+'">'+(NAMES[t.c]||t.c)+'</td><td style="color:#d29922">'+(t.v*100).toFixed(1)+'%</td></tr>'; }).join('')+
      '</table>';
    tip.innerHTML=h; tip.style.display='block';
    tip.style.left=Math.min(e.clientX+16, window.innerWidth-320)+'px';
    tip.style.top=(e.clientY+14)+'px';
    var nb=nearestAt(mx,my);
    cv.title = nb ? '点击选中 '+(NAMES[nb.c]||nb.c) : '';
  };
  cv.onclick=function(e){
    if(!CRSUB) return;
    var rect=cv.getBoundingClientRect();
    var nb=nearestAt(e.clientX-rect.left, e.clientY-rect.top);
    if(nb && nb.dy<18){ HI = (HI===nb.c) ? null : nb.c; render(); }
    else { HI=null; render(); }
  };
  cv.ondblclick=function(){ if(HI) zoomOne(HI); };
  cv.onmouseleave=function(){ tip.style.display='none'; };
}
